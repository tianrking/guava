name: Engineer 04 native validation
on:
  push:
    branches: [codex/guava-native-validation]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 410aba7ea2b1e2b889b2a36733a79b417257219e
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: |
            25
            26
          distribution: temurin
      - name: Identify exact source
        run: |
          git rev-parse HEAD
          git show -s --format='%H%n%an <%ae>%n%cn <%ce>' HEAD
          sha256sum guava/src/com/google/common/util/concurrent/Uninterruptibles.java guava-tests/test/com/google/common/util/concurrent/UninterruptiblesTest.java
      - name: Native RED regression on original production
        run: ./mvnw -B -Dtoolchain.skip clean package -Dtest='UninterruptiblesTest#test*Minimum*' -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false -Dmaven.javadoc.skip -Dsurefire.toolchain.version=25
      - name: Print Surefire reports
        if: always()
        run: ./util/print_surefire_reports.sh
